services:
  server-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: server-kafka-ui
    hostname: server-kafka-ui
    ports:
      - "9080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=server-kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=  # Empty because using kafka without zookeeper
    networks:
      - libofalex

networks:
  libofalex:
    driver: bridge