services:
  server-redis:
    image: redis:7-alpine
    container_name: server-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - libofalex

networks:
  libofalex:
    driver: bridge