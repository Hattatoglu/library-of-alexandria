server:
  port: 0

spring:
  application:
    name: server-gateway-test

gateway:
  auth:
    service-auth-base-url: http://placeholder   # overridden at runtime by @DynamicPropertySource
    public-key-cache-ttl: 5m
  ratelimit:
    bucket-capacity: 5
    refill-window: 60s
  security:
    paths:
      - public-path: /register
  routing:
    routes:
      - path-prefix: /register
        service-name: service-auth
        base-url: http://localhost:8089/api/v1/auth

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      service-auth:
        base-config: default

management:
  server:
    port: 0